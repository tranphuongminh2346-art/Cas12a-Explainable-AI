[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cas12a-xai"
version = "0.1.2"
authors = [
    { name="Minh Tran", email="tranphuongminh2346@gmail.com" },
]
description = "Explainable Machine Learning for CRISPR-Cas12a On-Target Cleavage Efficiency"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["CRISPR", "Cas12a", "Cpf1", "Bioinformatics", "Machine Learning", "Explainable AI", "SHAP", "Thermodynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "lightgbm>=3.3.0",
    "shap>=0.41.0",
]

[project.scripts]
cas12a-xai = "cas12a_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cas12a_xai = ["models/*.txt"]
